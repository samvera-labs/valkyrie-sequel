---
version: 2
jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.11-browsers
        environment:
          RAILS_ENV: test
          BUNDLE_PATH: vendor/bundle
          DB_HOST: localhost
          DB_USERNAME: valkyrie_sequel
          DB_PASSWORD:  ""
          DB_DATABASE: "valkyrie_sequel_test"
      - image: cimg/postgres:18.0
        environment:
          POSTGRES_USER: valkyrie_sequel
          POSTGRES_DB: valkyrie_sequel_test
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - checkout
      # Restore Cached Dependencies
      - type: cache-restore
        name: Restore bundle cache
        key: valkyrie-sequel-{{ checksum "Gemfile" }}
      - run: gem install bundler
      # Bundle install dependencies
      - run: bundle install
      # Cache Dependencies
      - type: cache-save
        name: Store bundle cache
        key: valkyrie-sequel-{{ checksum "Gemfile" }}
        paths:
          - vendor/bundle
      - run: bundle exec rubocop
      - run: bundle exec rspec spec
